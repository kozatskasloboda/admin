<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель терминала</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; text-align: center; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; display: inline-block; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 6px; border: none; }
        button { background: #007bff; color: white; cursor: pointer; }
        button:hover { background: #0056b3; }
        .current-bal { font-size: 24px; color: #4caf50; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Управление балансом</h2>
        <p>Текущий баланс в игре: <span id="currentBalance" class="current-bal">Загрузка...</span></p>
        <hr>
        <input type="number" id="newBalanceInput" placeholder="Введите новый баланс">
        <button onclick="updateBalance()">Установить баланс</button>
    </div>

    <script>
        // Вставьте сюда ваш BIN ID из Шага 1
        const BIN_ID = '6a93fda7f5f4af5e29542083'; 
        const API_URL = `https://api.jsonbin.io/v3/b/${6a93fda7f5f4af5e29542083}`;

        // 1. Чтение баланса для отображения в админке
        async function fetchBalance() {
            try {
                const res = await fetch(`${API_URL}/latest`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('currentBalance').textContent = data.record.balance;
                }
            } catch (err) {
                console.error("Ошибка получения баланса:", err);
            }
        }

        // 2. Изменение баланса из админки
        async function updateBalance() {
            const amount = parseFloat(document.getElementById('newBalanceInput').value);
            if (isNaN(amount)) return alert('Введите корректное число!');

            try {
                const res = await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ balance: amount })
                });

                if (res.ok) {
                    alert('Баланс успешно обновлен!');
                    document.getElementById('newBalanceInput').value = '';
                    fetchBalance(); // Обновляем цифру на экране админки
                } else {
                    alert('Ошибка обновления баланса');
                }
            } catch (err) {
                console.error(err);
                alert('Ошибка сети');
            }
        }

        // Автообновление показаний в админке каждые 3 секунды
        setInterval(fetchBalance, 3000);
        fetchBalance();
    </script>
</body>
</html>
