<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ Панель</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <h2>Управление терминалом #1</h2>
    <input type="number" id="balanceInput" placeholder="Введите новый баланс">
    <button onclick="setBalance()">Установить баланс</button>

    <script>
      const firebaseConfig = {
        databaseURL: "https://ВАШ_ПРОЕКТ.firebaseio.com"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      function setBalance() {
        const val = parseFloat(document.getElementById('balanceInput').value);
        if (!isNaN(val)) {
          // Записываем баланс в облако
          db.ref('terminal_1/balance').set(val).then(() => {
            alert('Баланс успешно изменен на ' + val);
          });
        }
      }
    </script>
</body>
</html>
